<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SATKA SPORT CITY — Football Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b25;color:white;font-family:system-ui,sans-serif;text-align:center}main{max-width:480px;margin:auto;padding:16px}h1{font-style:italic;font-size:30px;line-height:1;margin:8px;color:#ff63dc;text-shadow:0 0 18px #e600ad}h2{font-size:23px;margin:12px 0}.hud{display:flex;justify-content:space-between;gap:8px;border:1px solid #56dfff;border-radius:14px;padding:12px;font-weight:bold}.hearts{color:#ff60c8}.field{position:relative;width:100%;aspect-ratio:1.7;background:linear-gradient(#171d48,#254b4b);border-radius:12px;overflow:hidden}svg{width:100%;height:100%;display:block}button{width:100%;padding:17px;margin-top:12px;border:2px solid #ff9be7;border-radius:14px;background:#a51585;color:white;font-size:22px;font-weight:900;touch-action:manipulation;cursor:pointer;box-shadow:0 0 18px #a51585}button.secondary{font-size:14px;background:transparent;border-color:#61708e;box-shadow:none}#message{min-height:52px;display:grid;place-items:center;font-weight:bold}small{color:#b8c6e2} .record{margin:12px;color:#ffe36b}</style><main><h1>SATKA SPORT CITY</h1><small>FOOTBALL CHALLENGE • МИССИЯ 04</small><h2>ПОЙМАЙ ГОЛ!</h2><div class="hud"><span id="lives" class="hearts">♥ ♥ ♥</span><span id="score">0 XP</span><span id="level">Ур. 1</span></div><div class="record" id="record">Рекорд: 0 XP</div><div class="field"><svg viewBox="0 0 340 200" aria-label="Футбольные ворота с мишенью"><defs><pattern id="net" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H14V14" fill="none" stroke="#a8c3dd" opacity=".45"/></pattern></defs><path d="M0 80L50 35 95 70 160 25 220 70 280 40 340 80V180H0Z" fill="#34335e"/><path d="M0 164H340V200H0Z" fill="#245b40"/><rect x="18" y="22" width="304" height="143" fill="url(#net)" stroke="white" stroke-width="4"/><g stroke="#ff65d9" fill="none"><circle cx="282" cy="56" r="25" stroke-width="3"/><circle cx="282" cy="56" r="15" stroke-width="2"/><path d="M282 25V87M251 56H313"/></g><g id="ball" transform="translate(45 140)"><circle r="12" fill="white" stroke="#aaa"/><path d="M0 -7L7 -2 4 7H-4L-7 -2Z M-10 -6L-6 -10 M10 -6L6 -10 M-10 7L-6 10 M10 7L6 10" fill="#171b28" stroke="#171b28" stroke-width="2"/></g></svg></div><div id="message" role="status">Останови мяч точно в розовой мишени!</div><button id="action">НАЧАТЬ ИГРУ</button><button class="secondary" id="reset">Начать заново</button><p><small>+100 XP за гол • промах −1 жизнь<br>Спортивная школа им. В. И. Гундарцева</small></p></main><script>
const $=id=>document.getElementById(id);let best=0;try{best=Number(localStorage.getItem('satkaFootballBest'))||0}catch(e){}let score=0,lives=3,level=1,state='ready',x=45,y=140,t=0,last=0;const pts=[[45,140],[160,55],[250,140],[282,56],[55,55],[170,140],[282,56],[45,140]];function hud(){$('lives').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives);$('score').textContent=score+' XP';$('level').textContent='Ур. '+level;$('record').textContent='Рекорд: '+best+' XP'}function reset(){score=0;lives=3;level=1;state='ready';t=0;x=45;y=140;$('ball').setAttribute('transform','translate(45 140)');$('message').textContent='Останови мяч точно в розовой мишени!';$('action').textContent='НАЧАТЬ ИГРУ';hud()}function start(){state='running';t=0;$('action').textContent='СТОП!';$('message').textContent='Лови момент!'}$('action').onclick=()=>{if(state==='over'){reset();start();return}if(state!=='running'){start();return}let hit=Math.hypot(x-282,y-56)<=13;if(hit){score+=100;level=1+Math.floor(score/200);if(score>best){best=score;try{localStorage.setItem('satkaFootballBest',String(best))}catch(e){}}$('message').textContent='ГОООЛ! +100 XP!'}else{lives--;$('message').textContent='Промах! −1 жизнь'}state=lives?'paused':'over';if(!lives)$('message').textContent='Игра окончена! Твой результат: '+score+' XP';$('action').textContent=lives?'ПРОДОЛЖИТЬ':'ИГРАТЬ ЕЩЁ';hud()};$('reset').onclick=reset;function frame(now){let dt=last?Math.min(now-last,50):0;last=now;if(state==='running'){t+=dt;let k=t/Math.max(210,620/(1+(level-1)*.17)),i=Math.floor(k)%(pts.length-1),f=k%1;x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f;y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;$('ball').setAttribute('transform',`translate(${x} ${y})`)}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></html>
